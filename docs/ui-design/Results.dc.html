<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700&display=swap">
<style>
body{margin:0}
button,input{font:inherit}
a{color:#FFFFFF}a:hover{color:#A7ABB8}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #14151A; color: #FFFFFF; font-family: 'Titillium Web', sans-serif; display: flex; flex-direction: column">

<div style="height: 56px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 32px; border-bottom: 1px solid #353945">
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; gap: 4px">
<div style="width: 10px; height: 10px; border-radius: 50%; background: #E0241B"></div>
<div style="width: 10px; height: 10px; border-radius: 50%; background: #E0241B"></div>
<div style="width: 10px; height: 10px; border-radius: 50%; background: #E0241B"></div>
<div style="width: 10px; height: 10px; border-radius: 50%; background: #E0241B"></div>
<div style="width: 10px; height: 10px; border-radius: 50%; background: #E0241B"></div>
</div>
<div style="font-size: 22px; font-weight: 700; font-style: italic; letter-spacing: 0.04em">LIGHTS OUT</div>
</div>
<div style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em; color: #A7ABB8">RACE CLASSIFICATION</div>
<div style="flex-grow: 1"></div>
<div style="font-size: 12px; color: #A7ABB8">Melbourne · 5 laps</div>
</div>

<div style="flex-grow: 1; box-sizing: border-box; padding: 20px 24px; display: flex; gap: 16px; min-height: 0">

<div style="width: 380px; box-sizing: border-box; background: #1D1F26; border-top: 3px solid #E0241B; border-radius: 0 0 24px 0; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #A7ABB8">YOUR RESULT</div>
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 112px; height: 112px; background: #FFFFFF; color: #14151A; border-radius: 0 0 24px 0; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 900; font-style: normal">P2</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 34px; line-height: 1; font-weight: 700; font-style: italic">FINISH</div>
<div style="font-size: 16px; color: #A7ABB8">+2.318 to the winner</div>
</div>
</div>
<div style="display: flex; flex-direction: column">
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #353945">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">BEST LAP</span>
<span style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">1:22.640</span>
</div>
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #353945">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">STARTED</span>
<span style="font-size: 18px; font-weight: 700">P6</span>
</div>
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #353945">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">PIT STOPS</span>
<span style="font-size: 18px; font-weight: 700">1</span>
</div>
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #353945; border-bottom: 1px solid #353945">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">PENALTIES</span>
<span style="font-size: 18px; font-weight: 700">None</span>
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<button style="height: 56px; border: none; border-radius: 0 0 16px 0; background: #E0241B; color: #FFFFFF; font-size: 20px; font-weight: 700; font-style: italic; letter-spacing: 0.06em; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
<span>RACE AGAIN</span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
<button style="height: 44px; background: none; color: #FFFFFF; border: 1px solid #A7ABB8; border-radius: 0 0 10px 0; font-size: 14px; font-weight: 700; cursor: pointer">Back to menu</button>
</div>
</div>

<div style="flex-grow: 1; min-width: 0; background: #1D1F26; border-radius: 0 0 24px 0; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 44px; padding: 0 24px 0 0; display: flex; align-items: center; gap: 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">
<span style="width: 56px; text-align: center">POS</span>
<span style="width: 4px"></span>
<span style="flex-grow: 1">DRIVER</span>
<span style="width: 120px">STINTS</span>
<span style="width: 110px; text-align: right">BEST LAP</span>
<span style="width: 130px; text-align: right">TIME / GAP</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="height: 60px; padding: 0 24px 0 0; display: flex; align-items: center; gap: 16px; border-top: 1px solid #353945; background: {{r.bg}}; color: {{r.fg}}">
<span style="width: 56px; text-align: center; font-size: 22px; font-weight: 700">{{r.pos}}</span>
<span style="width: 4px; height: 28px; background: {{r.team}}"></span>
<span style="flex-grow: 1; display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 20px; font-weight: 700">{{r.code}}</span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: {{r.sub}}">{{r.note}}</span>
</span>
<span style="width: 120px; display: flex; align-items: center; gap: 6px">
<sc-for list="{{r.stints}}" as="s" hint-placeholder-count="2">
<span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; background: #14151A; border: 3px solid {{s.c}}; color: {{s.c}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900">{{s.t}}</span>
</sc-for>
</span>
<span style="width: 110px; text-align: right; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{r.sub}}">{{r.best}}</span>
<span style="width: 130px; text-align: right; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.time}}</span>
</div>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const tc = { S: '#E8352E', M: '#FFD12E', H: '#F2F0EB' };
const raw = [
['VAL', '#E8322E', 'SM', '1:22.512', '6:58.412', 'FASTEST LAP'],
['YOU', '#FFD21F', 'MH', '1:22.640', '+2.318', ''],
['ORS', '#2F6BFF', 'MS', '1:22.905', '+4.871', ''],
['KIM', '#FF8A1F', 'HM', '1:23.118', '+9.240', ''],
['DUV', '#13C4A3', 'MH', '1:23.377', '+13.062', ''],
['MAR', '#C9CED6', 'SH', '1:23.401', '+17.559', '+5 S PENALTY'],
['SEN', '#7A3CFF', 'HS', '1:23.820', '+24.730', ''],
['HAK', '#FF4F9A', 'MH', '1:24.106', '+31.495', '']
];
const rows = raw.map((r, i) => { const me = r[0] === 'YOU'; return { pos: i + 1, code: r[0], team: r[1], stints: r[2].split('').map((t) => ({ t, c: tc[t] })), best: r[3], time: r[4], note: r[5], bg: me ? '#FFFFFF' : 'transparent', fg: me ? '#14151A' : '#FFFFFF', sub: me ? '#4A4E5A' : '#A7ABB8' }; });
return { rows };
}
}
</script>
</body>
</html>
