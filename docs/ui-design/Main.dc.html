<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lights Out main menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700&display=swap">
<style>
body{margin:0}
button,input{font:inherit}
a{color:#FFFFFF}a:hover{color:#A7ABB8}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #14151A; color: #FFFFFF; font-family: 'Titillium Web', sans-serif; display: flex; flex-direction: column">

<div style="height: 56px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 32px; border-bottom: 1px solid #353945">
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; gap: 4px">
<div style="width: 10px; height: 10px; border-radius: 50%; background: #E0241B"></div>
<div style="width: 10px; height: 10px; border-radius: 50%; background: #E0241B"></div>
<div style="width: 10px; height: 10px; border-radius: 50%; background: #E0241B"></div>
<div style="width: 10px; height: 10px; border-radius: 50%; background: #E0241B"></div>
<div style="width: 10px; height: 10px; border-radius: 50%; background: #E0241B"></div>
</div>
<div style="font-size: 22px; font-weight: 700; font-style: italic; letter-spacing: 0.04em">LIGHTS OUT</div>
</div>
<div style="display: flex; align-self: stretch; gap: 4px">
<button style="height: 56px; padding: 0 16px; background: none; border: none; border-bottom: 3px solid #E0241B; color: #FFFFFF; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; cursor: pointer">SINGLE PLAYER</button>
<button style="height: 56px; padding: 0 16px; background: none; border: none; border-bottom: 3px solid transparent; color: #A7ABB8; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; cursor: pointer">ONLINE</button>
<button style="height: 56px; padding: 0 16px; background: none; border: none; border-bottom: 3px solid transparent; color: #A7ABB8; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; cursor: pointer">CONTROLS</button>
</div>
<div style="flex-grow: 1"></div>
<div style="font-size: 12px; color: #A7ABB8">Unofficial fan project</div>
</div>

<div style="flex-grow: 1; box-sizing: border-box; padding: 20px 24px; display: flex; gap: 16px; min-height: 0">

<div style="width: 340px; box-sizing: border-box; background: #1D1F26; border-top: 3px solid #E0241B; border-radius: 0 0 24px 0; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 18px; font-weight: 700; font-style: italic; letter-spacing: 0.04em">SESSION SETUP</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8; text-transform: uppercase">{{g.label}}</div>
<div style="display: flex; gap: 2px; border-radius: 0 0 10px 0; overflow: hidden">
<sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3">
<button style="flex: 1 1 0; height: 44px; border: none; background: {{o.bg}}; color: {{o.fg}}; font-size: 14px; font-weight: 700; cursor: pointer">{{o.t}}</button>
</sc-for>
</div>
</div>
</sc-for>
<div style="flex-grow: 1"></div>
<button style="height: 56px; border: none; border-radius: 0 0 16px 0; background: #E0241B; color: #FFFFFF; font-size: 20px; font-weight: 700; font-style: italic; letter-spacing: 0.06em; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
<span>START RACE</span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0">
<div style="flex-grow: 1; box-sizing: border-box; background: #1D1F26; border-radius: 0 0 24px 0; padding: 24px 28px; display: flex; gap: 16px; position: relative; overflow: hidden">
<div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #A7ABB8">CIRCUIT 01 / 40 · CURRENT CALENDAR</div>
<div style="font-size: 60px; line-height: 1; font-weight: 700; font-style: italic; margin-top: 10px">MELBOURNE</div>
<div style="font-size: 20px; color: #A7ABB8; margin-top: 6px">Australia</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">LENGTH</div>
<div style="font-size: 26px; font-weight: 700">5.278 <span style="font-size: 14px; font-weight: 600; color: #A7ABB8">km</span></div>
</div>
<div style="width: 1px; background: #353945"></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">RACE</div>
<div style="font-size: 26px; font-weight: 700">26.39 <span style="font-size: 14px; font-weight: 600; color: #A7ABB8">km</span></div>
</div>
<div style="width: 1px; background: #353945"></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">OPENED</div>
<div style="font-size: 26px; font-weight: 700">1953</div>
</div>
</div>
</div>
<svg width="218" height="264" viewBox="-8 -8 345 416" fill="none" style="flex-shrink: 0; align-self: center" aria-label="Melbourne circuit outline">
<path stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" d="M130 105 L110 125 L80 155 L78 157 L77 159 L77 160 L78 161 L79 164 L80 167 L82 171 L82 175 L82 179 L81 185 L80 189 L78 192 L75 195 L70 201 L64 206 L55 215 L44 227 L39 231 L28 246 L22 253 L16 263 L5 283 L2 288 L0 292 L0 295 L1 296 L4 298 L12 299 L27 302 L29 303 L30 304 L31 305 L32 308 L32 311 L31 341 L31 352 L31 353 L34 357 L37 359 L60 375 L65 378 L89 388 L97 391 L106 396 L112 399 L114 400 L117 400 L119 399 L121 396 L124 393 L129 390 L134 388 L142 387 L148 387 L154 386 L160 384 L165 381 L172 377 L176 373 L180 368 L183 361 L186 354 L187 349 L188 345 L193 315 L193 311 L193 307 L191 302 L189 298 L186 294 L183 290 L180 286 L179 283 L177 280 L176 276 L170 243 L170 239 L169 234 L169 230 L170 222 L171 216 L172 209 L174 202 L177 196 L180 190 L185 183 L188 178 L194 172 L215 153 L218 151 L221 149 L224 148 L228 147 L232 146 L237 147 L242 147 L247 147 L250 147 L254 146 L257 144 L259 143 L263 139 L286 120 L295 113 L299 108 L302 104 L306 99 L309 91 L312 81 L322 50 L327 30 L328 24 L329 21 L329 20 L327 19 L323 17 L302 9 L281 1 L280 0 L277 0 L274 0 L270 2 L267 4 L265 6 L263 9 L251 32 L243 44 L242 45 L241 46 L240 47 L238 47 L237 46 L223 31 L221 29 L219 28 L217 27 L214 26 L212 26 L210 27 L207 28 L204 30 L203 31Z"></path>
<path stroke="#E0241B" stroke-width="7" d="M130 105 L110 125"></path>
</svg>
</div>

<div style="box-sizing: border-box; background: #1D1F26; border-radius: 0 0 24px 0; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="font-size: 18px; font-weight: 700; font-style: italic; letter-spacing: 0.04em">RACE ONLINE</div>
<div style="font-size: 12px; color: #A7ABB8">Up to 10 drivers per room</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="nick" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">DRIVER NAME</label>
<input id="nick" type="text" placeholder="Your name" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #14151A; border: 1px solid #353945; color: #FFFFFF; font-size: 15px; border-radius: 0 0 10px 0">
<div style="display: flex; gap: 8px">
<button style="flex: 1 1 0; height: 44px; background: #FFFFFF; color: #14151A; border: none; border-radius: 0 0 10px 0; font-size: 14px; font-weight: 700; cursor: pointer">Host public</button>
<button style="flex: 1 1 0; height: 44px; background: none; color: #FFFFFF; border: 1px solid #A7ABB8; border-radius: 0 0 10px 0; font-size: 14px; font-weight: 700; cursor: pointer">Host private</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="code" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">ROOM CODE</label>
<div style="display: flex; gap: 8px">
<input id="code" type="text" placeholder="Enter code" style="flex: 1 1 0; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; background: #14151A; border: 1px solid #353945; color: #FFFFFF; font-size: 15px; letter-spacing: 0.12em; border-radius: 0 0 10px 0">
<button style="width: 84px; height: 44px; background: none; color: #FFFFFF; border: 1px solid #A7ABB8; border-radius: 0 0 10px 0; font-size: 14px; font-weight: 700; cursor: pointer">Join</button>
</div>
<div style="height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #353945; font-size: 14px; color: #A7ABB8">
<span>No public rooms open</span>
<button style="height: 44px; padding: 0 4px; background: none; border: none; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">Refresh</button>
</div>
</div>
</div>
</div>
</div>

<div style="width: 300px; box-sizing: border-box; background: #1D1F26; border-radius: 0 0 24px 0; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 16px 20px 10px; display: flex; align-items: baseline; justify-content: space-between">
<div style="font-size: 18px; font-weight: 700; font-style: italic; letter-spacing: 0.04em">CIRCUITS</div>
<div style="font-size: 12px; color: #A7ABB8">40 venues</div>
</div>
<div style="padding: 0 20px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A7ABB8">CURRENT CALENDAR</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{circuits}}" as="c" hint-placeholder-count="11">
<button style="height: 44px; padding: 0 20px; border: none; border-top: 1px solid #353945; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
<span style="width: 20px; font-size: 13px; font-weight: 600; color: {{c.sub}}">{{c.n}}</span>
<span style="flex-grow: 1; font-size: 15px; font-weight: 700">{{c.city}}</span>
<span style="font-size: 13px; color: {{c.sub}}">{{c.country}}</span>
</button>
</sc-for>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const seg = (label, opts, sel) => ({ label, opts: opts.map((t, i) => ({ t, bg: i === sel ? '#FFFFFF' : '#2A2D37', fg: i === sel ? '#14151A' : '#FFFFFF' })) });
const groups = [
seg('Session', ['Race', 'Time trial'], 0),
seg('Race distance', ['3 laps', '5 laps', '10 laps'], 1),
seg('Grid size', ['6', '8', '10'], 1),
seg('Opponents', ['Rookie', 'Pro', 'Ace'], 1),
seg('Incidents', ['Off', 'Realistic', 'Chaotic'], 1),
seg('Camera', ['Cockpit', 'Chase', 'Top-down'], 0)
];
const list = [['Melbourne', 'Australia'], ['Shanghai', 'China'], ['Suzuka', 'Japan'], ['Sakhir', 'Bahrain'], ['Jeddah', 'Saudi Arabia'], ['Miami', 'United States'], ['Montreal', 'Canada'], ['Monaco', 'Monaco'], ['Barcelona', 'Spain'], ['Spielberg', 'Austria'], ['Silverstone', 'Great Britain']];
const circuits = list.map((c, i) => ({ n: String(i + 1).padStart(2, '0'), city: c[0], country: c[1], bg: i === 0 ? '#FFFFFF' : 'transparent', fg: i === 0 ? '#14151A' : '#FFFFFF', sub: i === 0 ? '#4A4E5A' : '#A7ABB8' }));
return { groups, circuits };
}
}
</script>
</body>
</html>
