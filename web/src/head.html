<title>Lights Out Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed race view; broadcast-style graphics pinned to the corners; menu is a pit-wall panel over a live attract race */
:root{
  --night:#0f1114; --panel:rgba(12,14,17,.86); --panel-solid:#15181c; --line:#2b3037; --line-hi:#3c434c;
  --ink:#f1ede4; --muted:#8d939b;
  --signal:#ffd21f; --purple:#b65cff; --green:#2fd673; --red:#ee3a2f; --blue:#3a8dff; --ers:#3aa0ff;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#game,#three{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#tower{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));min-width:230px;padding:0 0 4px;font-family:var(--f-body);font-size:14px;overflow:hidden}
#tower .hd{display:flex;justify-content:space-between;padding:7px 10px 6px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:#06080a;border-bottom:2px solid var(--red);margin-bottom:3px}
#tower .hd span:last-child{color:var(--muted);font-size:12px;font-family:var(--f-body);font-weight:600;letter-spacing:.1em;align-self:center}
#tower .row{display:grid;grid-template-columns:22px 4px 40px 1fr auto 20px;gap:7px;align-items:center;padding:2px 10px 2px 8px;font-variant-numeric:tabular-nums;height:22px}
#tower .row.me{background:rgba(255,210,31,.14)}
#tower .row.dnf{opacity:.45}
#tower .pos{background:#f1ede4;color:#0f1114;font-weight:700;text-align:center;border-radius:2px;font-size:12px;line-height:18px}
#tower .sw{width:4px;height:16px;border-radius:1px}
#tower .code{font-weight:700;letter-spacing:.04em}
#tower .gap{color:#c9ccd1;text-align:right;font-family:var(--f-mono);font-size:12px;grid-column:5}
#tower .tag{grid-column:4;justify-self:start;font-size:10px;font-weight:700;letter-spacing:.08em;padding:1px 5px;border-radius:2px}
#tower .tag.pit{background:#f1ede4;color:#0f1114}#tower .tag.out{background:#6b7280;color:#fff}#tower .tag.pen{background:var(--red);color:#fff}#tower .tag.ot{background:var(--green);color:#06210f}
.tdot{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:3px solid var(--c);font:700 9px/1 var(--f-body);color:#f1ede4;background:#0d0f12;box-sizing:border-box}
#tower .sec{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 10px}
#tower .sec div{padding:4px 6px;border-radius:2px;background:#1d2126;text-align:center;font-size:12px;font-family:var(--f-mono)}
#tower .sec .p{background:var(--purple);color:#fff}
#tower .sec .g{background:var(--green);color:#06210f}
#tower .sec .y{background:var(--signal);color:#221b00}
#tower .kv{display:flex;justify-content:space-between;padding:3px 10px;gap:16px;font-family:var(--f-mono);font-size:13px}
#tower .kv span:first-child{color:var(--muted);font-family:var(--f-body)}

#flagbar{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:grid;justify-items:center;padding:6px 18px 7px;border-radius:4px;min-width:220px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.35)}
#flagText{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
#flagSub{font-size:12px;font-weight:600;letter-spacing:.06em;margin-top:2px}
#flagbar.yellow,#flagbar.sc,#flagbar.vsc{background:var(--signal);color:#1a1500}
#flagbar.green{background:var(--green);color:#04210e}
#flagbar.blue{background:var(--blue);color:#fff}
#flagbar.bw{background:linear-gradient(135deg,#111 0 50%,#f1ede4 50% 100%);color:#fff;text-shadow:0 1px 3px #000}

#lapbox{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:8px 14px 10px;text-align:right;min-width:150px}
#lapbox .lab{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
#lapnum{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}
#laptime{font-size:18px;margin-top:4px}
#delta{font-size:13px;min-height:1.2em}
#delta.up{color:var(--red)} #delta.dn{color:var(--green)}
#lastline{font-size:12px;color:var(--muted)}
#pausebtn{pointer-events:auto;position:absolute;right:12px;top:calc(140px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:4px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center}
#pausebtn svg{width:16px;height:16px;fill:var(--ink)}

#lights{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;gap:8px;padding:8px 10px;background:#0a0b0d;border:1px solid var(--line);border-radius:6px}
#lights .pod{display:grid;gap:6px;padding:6px;background:#16191d;border-radius:4px}
#lights i{display:block;width:22px;height:22px;border-radius:50%;background:#2a1513;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4)}
#lights .pod.on i{background:var(--red);box-shadow:0 0 14px var(--red),inset 0 -3px 0 rgba(0,0,0,.25)}

#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,44px);letter-spacing:.04em;text-transform:uppercase;text-align:center;padding:4px 16px;opacity:0;transition:opacity .2s;white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#toast.show{opacity:1}
#toast.purple{color:var(--purple)} #toast.green{color:var(--green)} #toast.red{color:var(--red)} #toast.yellow{color:var(--signal)}
#ww{position:absolute;left:50%;top:42%;transform:translateX(-50%);font-family:var(--f-display);font-weight:900;font-size:40px;color:var(--red);letter-spacing:.06em;text-shadow:0 2px 12px rgba(0,0,0,.7)}

/* dash: speed, gear, energy store, power modes */
#dash{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;grid-template-columns:auto auto 1fr;gap:4px 12px;align-items:center;padding:8px 14px 10px;width:min(420px,calc(100vw - 24px));box-sizing:border-box}
#spd{font-family:var(--f-display);font-weight:900;font-size:50px;line-height:.85;text-align:right;min-width:3ch;font-variant-numeric:tabular-nums;grid-row:1/3}
#gear{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;color:var(--signal);grid-row:1/3}
.ers{display:grid;gap:4px;min-width:0}
.ers .top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ers .top b{color:var(--ink);font-family:var(--f-mono);letter-spacing:0;font-weight:600}
#socFill{height:10px;border-radius:2px;background:#1d2633;position:relative;overflow:hidden}
#socFill::after{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(calc(var(--v,0) / 1.125));background:var(--ers);transition:background .2s}
#socFill[data-state="boost"]::after{background:var(--signal)}
#socFill[data-state="ot"]::after{background:var(--green)}
#socFill[data-state="harv"]::after{background:#7cc6ff}
#socFill[data-state="low"]::after{background:var(--red)}
.chips{grid-column:1/4;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:#1d2126;color:var(--muted);border:1px solid #2b3037}
.chip[data-on="1"]{background:var(--signal);color:#1a1500;border-color:var(--signal)}
#chipOT[data-on="1"]{background:rgba(47,214,115,.18);color:var(--green);border-color:var(--green)}
#chipOT[data-on="2"]{background:var(--green);color:#04210e;border-color:var(--green)}
#chipAero[data-on="1"]{background:var(--ers);color:#04121f;border-color:var(--ers)}
.pedals{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pedals i{display:block;height:3px;border-radius:2px;background:#262a30;overflow:hidden;position:relative}
.pedals i::after{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--v,0));background:var(--c)}
#pthr{--c:var(--green)} #pbrk{--c:var(--red)}

/* tyres + pit */
#tyrebox{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;width:230px;box-sizing:border-box;pointer-events:auto}
#tyreC{width:42px;height:42px;border-radius:50%;border:6px solid var(--c);display:grid;place-items:center;font:800 15px/1 var(--f-body);background:#0b0d10;box-sizing:border-box;grid-row:1/3}
.tw{display:grid;gap:3px}
.tw .l{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tw .l b{font-family:var(--f-mono);color:var(--ink);letter-spacing:0}
#tyreBar{height:6px;border-radius:2px;background:#262a30;position:relative;overflow:hidden}
#tyreBar::after{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--v,1));background:var(--green)}
#tyreBar[data-state="mid"]::after{background:var(--signal)}#tyreBar[data-state="low"]::after{background:var(--red)}
.nextrow{grid-column:1/3;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#tyreNext{display:flex;gap:4px}
.tsel{width:26px;height:26px;border-radius:50%;border:3px solid var(--c);background:#0b0d10;font:800 11px/1 var(--f-body);cursor:pointer;opacity:.45;padding:0}
.tsel.on{opacity:1;box-shadow:0 0 0 2px var(--ink)}
#boxState{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:3px;border:1px solid var(--line-hi);background:#1d2126;cursor:pointer}
#boxState[data-on="1"]{background:#f1ede4;color:#0f1114;border-color:#f1ede4}
#pitInfo{grid-column:1/3;font-size:12px;color:var(--muted)}
#pitInfo[data-warn="1"]{color:var(--signal)}
#radio{position:absolute;left:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;width:min(330px,calc(100vw - 24px))}
#radio .msg{background:var(--panel);border-left:4px solid var(--ink);padding:6px 10px;font-size:13px;line-height:1.35;border-radius:2px}
#radio .msg.yellow{border-color:var(--signal)}#radio .msg.red{border-color:var(--red)}#radio .msg.green{border-color:var(--green)}#radio .msg.blue{border-color:var(--blue)}
#radio .who{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

#mini{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:170px;height:170px;background:var(--panel);border:1px solid var(--line);border-radius:4px}

#touch{position:absolute;inset:auto 0 0 0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;padding-inline:10px;pointer-events:none}
#touch .grp{display:flex;gap:8px;pointer-events:auto;align-items:flex-end}
#touch .acts{display:grid;grid-template-columns:repeat(2,auto);gap:6px;margin-right:4px}
#touch button{width:68px;height:68px;border-radius:50%;border:1px solid var(--line-hi);background:rgba(13,15,18,.6);display:grid;place-items:center;touch-action:none;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em}
#touch .acts button{width:52px;height:36px;border-radius:6px;font-size:12px}
#touch button.on{background:rgba(255,210,31,.3);border-color:var(--signal)}
#touch svg{width:26px;height:26px;fill:var(--ink)}

/* ---------- Menu ---------- */
#menu{position:fixed;inset:0;display:grid;grid-template-columns:minmax(300px,390px) 1fr;background:linear-gradient(90deg,rgba(15,17,20,.96) 0,rgba(15,17,20,.96) 390px,rgba(15,17,20,.62) 100%)}
.side{overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line)}
.brand .lamps{display:flex;gap:6px;margin-bottom:10px}
.brand .lamps i{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(238,58,47,.7);animation:lamp 6s infinite}
.brand .lamps i:nth-child(2){animation-delay:.25s}.brand .lamps i:nth-child(3){animation-delay:.5s}.brand .lamps i:nth-child(4){animation-delay:.75s}.brand .lamps i:nth-child(5){animation-delay:1s}
@keyframes lamp{0%,70%{opacity:1}75%,100%{opacity:.18;box-shadow:none}}
h1{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.85;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{display:block;color:var(--signal)}
.tag{color:var(--muted);margin:10px 0 0;line-height:1.45;max-width:36ch}
.sel{border-top:1px solid var(--line);padding-top:16px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.selname{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;margin:4px 0 12px;text-wrap:balance}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:11px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;padding:0}
.seg{display:flex;border:1px solid var(--line-hi);border-radius:4px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;text-align:center;padding:7px 4px;cursor:pointer;font-weight:600;font-size:14px;border-left:1px solid var(--line-hi);transition:background .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.seg label:first-of-type{border-left:0}
.seg input:checked+label{background:var(--ink);color:var(--night)}
.seg input:focus-visible+label{outline:2px solid var(--signal);outline-offset:-2px}
.seg label .tdot{width:16px;height:16px;border-width:3px;font-size:8px}
fieldset[disabled]{opacity:.35}
.go{appearance:none;border:0;border-radius:4px;background:var(--signal);color:#1a1500;font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.05em;text-transform:uppercase;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.go:hover{filter:brightness(1.08)}
.go svg{width:22px;height:22px;fill:currentColor}
details.help{border-top:1px solid var(--line);padding-top:12px}
details.help summary{cursor:pointer;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);list-style:none}
details.help summary::before{content:"+ ";color:var(--signal)}
details.help[open] summary::before{content:"– "}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;color:var(--muted);align-items:center;margin-top:10px}
.rules{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:13px;color:#c5c9cf;line-height:1.4}
.rules b{color:var(--ink)}
kbd{font-family:var(--f-mono);font-size:11px;color:var(--ink);border:1px solid var(--line-hi);border-bottom-width:2px;border-radius:3px;padding:1px 6px;white-space:nowrap}
.credit{font-size:12px;color:var(--muted);line-height:1.45;margin:auto 0 0}
.credit a{color:var(--ink)}
.tracks{overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.tracks h2{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.tracks h2 small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.tracks h2:not(:first-child){margin-top:28px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{appearance:none;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 10px 9px;display:grid;gap:6px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line-hi);transform:translateY(-1px)}
.card[aria-pressed="true"]{border-color:var(--signal);background:rgba(36,32,12,.88)}
.card canvas{width:100%;aspect-ratio:3/2;display:block}
.card .cn{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cm{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.card .cm span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cm span:last-child{font-family:var(--f-mono);white-space:nowrap}
.card .cf{display:flex;gap:4px;align-items:center;min-height:16px}
.card .cf i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:2px;background:#262a30;color:#c5c9cf}
.card .cf i.night{background:#1b2440;color:#9fb4ff}
.card .best{font-style:normal;margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--purple)}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,9,11,.72);padding:16px}
.sheet{background:var(--panel-solid);border:1px solid var(--line);border-radius:6px;padding:22px 22px 18px;width:min(620px,100%);max-height:100%;overflow:auto;box-sizing:border-box}
.sheet h3{font-family:var(--f-display);font-weight:900;font-size:40px;text-transform:uppercase;margin:0 0 4px;line-height:1}
.sheet .sub{color:var(--muted);margin:0 0 16px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{appearance:none;border:1px solid var(--line-hi);background:transparent;border-radius:4px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--signal);color:#1a1500;border-color:var(--signal)}
.btn:hover{border-color:var(--ink)}
.restable{overflow-x:auto}
table.res{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
table.res th{text-align:left;font-family:var(--f-body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 6px;border-bottom:1px solid var(--line)}
table.res td{padding:6px 6px;border-bottom:1px solid #20242a;white-space:nowrap}
table.res tr.me td{background:rgba(255,210,31,.1)}
table.res td.r,table.res th.r{text-align:right}
table.res .sw{display:inline-block;width:4px;height:13px;border-radius:1px;margin-right:8px;vertical-align:-2px}
table.res .fl{color:var(--purple)}
table.res .tyres{display:flex;gap:3px}
table.res small{color:var(--red)}

@media (max-width:760px){
  #menu{display:block;overflow:auto;background:rgba(15,17,20,.9)}
  .side{overflow:visible;border-right:0;padding-inline:16px;gap:16px}
  .tracks{overflow:visible;padding-inline:16px}
  h1{font-size:52px}
  .tgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  #tower{min-width:0;width:168px;font-size:12px;left:8px}
  #tower .row{grid-template-columns:18px 3px 34px 1fr auto 16px;padding:1px 6px;gap:4px;height:19px}
  #tower .gap{font-size:10px}
  #tower .hd{font-size:13px;padding:5px 8px}
  .tdot{width:15px;height:15px;border-width:2px;font-size:7px}
  #lapbox{right:8px;min-width:110px;padding:6px 10px 8px}
  #lapnum{font-size:24px}
  #laptime{font-size:14px}
